[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["queueless_backend", "queue_tracker", "notifications", "mock_api"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "queueless_backend.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["queueless_backend"]
